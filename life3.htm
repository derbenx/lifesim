<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balanced ALife Sandbox</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050508; font-family: monospace;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #telemetry {
            position: absolute; top: 15px; left: 15px;
            background: rgba(5, 5, 8, 0.9); color: #fff; padding: 15px;
            border-radius: 6px; border: 1px solid #222; pointer-events: none;
            line-height: 1.6; font-size: 0.9rem;
        }
        .pink-txt { color: #ff52a2; font-weight: bold; }
        .blue-txt { color: #00d2ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="telemetry">
        <strong>ALIFE ECOSYSTEM LOG</strong><br>
        Total Population: <span id="popTotal">14</span><br>
        Females (<span class="pink-txt">F</span>): <span id="popFemales">7</span><br>
        Males (<span class="blue-txt">M</span>): <span id="popMales">7</span>
    </div>

    <canvas id="sandboxCanvas"></canvas>

    <script>
        const canvas = document.getElementById('sandboxCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const INITIAL_POPULATION = 14;
        const BREED_COOLDOWN_MAX = 180;

        const creatures = [];
        const scentTrails = [];
        const foods = [];
        const MAX_FOODS = 20;

        class Food {
            constructor(x, y, initialSize = 1) {
                this.x = x;
                this.y = y;
                this.size = initialSize;
            }

            get hpValue() {
                // map size linearly from 1 to 10 onto 1 to 20 hp
                return 1 + (this.size - 1) * (19 / 9);
            }

            update() {
                if (this.size < 10) {
                    this.size += 0.005; // Growth rate
                    if (this.size > 10) this.size = 10;
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = '#39ff14'; // Bright green
                ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function spawnFood(initialSize = 1) {
            const padding = 10;
            const x = padding + Math.random() * (canvas.width - padding * 2);
            const y = padding + Math.random() * (canvas.height - padding * 2);
            foods.push(new Food(x, y, initialSize));
        }

        function initFood() {
            for (let i = 0; i < MAX_FOODS; i++) {
                spawnFood(Math.random() * 9 + 1);
            }
        }

//b2a
        class Creature {
            constructor(x, y, gender, isBaby = false) {
                this.x = x;
                this.y = y;
                this.gender = gender;
                this.color = this.gender === 'f' ? '#ff52a2' : '#00d2ff';
                this.breedCooldownAge = 0;
                this.opacity = 1;
                this.isDead = false;

                // HP AND HEALTH SYSTEM LIFEPOOLS
                this.hp = 100;

                // RANDOM STARTING AGE SETTING
                this.age = isBaby ? 1.0 : Math.random() * 4 + 3;
                this.prevAgeFloor = Math.floor(this.age);

                // BELL-CURVE PREDETERMINED MAX LIFESPAN SELECTION
                const u1 = Math.random(); const u2 = Math.random();
                const normalRandom = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
                this.maxLifespan = 7.5 + normalRandom * 1.5;
                this.maxLifespan = Math.max(4.0, Math.min(9.99, this.maxLifespan));

                // Physics base configuration
                this.baseSpeed = Math.random() * 1.2 + 0.8;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * this.baseSpeed;
                this.vy = Math.sin(angle) * this.baseSpeed;
            }

            get radius() {
                return Math.max(1, Math.min(10, Math.floor(this.age)));
            }

            draw() {
                ctx.save(); ctx.globalAlpha = this.opacity;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill();

                if (this.gender === 'm' && this.breedCooldownAge && this.age < this.breedCooldownAge && this.age < this.maxLifespan) {
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
                }
                if ((this.gender === 'f' && this.radius >= 4 && this.radius <= 7) || (this.gender === 'm' && this.radius >= 4 && this.radius <= 8)) {
                    if (this.age < this.maxLifespan) { ctx.fillStyle = '#ffffff'; ctx.fillRect(this.x - 1, this.y - 1, 2, 2); }
                }

                // DYNAMIC LITE HP BAR RENDERING WINDOW OVER THEIR HEADS
                if (this.age < this.maxLifespan && this.hp < 100 && this.hp > 0) {
                    const barW = this.radius * 2.5; const barH = 3;
                    const barX = this.x - barW / 2; const barY = this.y - this.radius - 6;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX, barY, barW, barH);
                    // Hue shift physics: Green at 100 HP, turning Red as health drains out
                    ctx.fillStyle = `hsl(${this.hp * 1.2}, 100%, 50%)`;
                    ctx.fillRect(barX, barY, barW * (this.hp / 100), barH);
                }
                ctx.restore();
            }
//b2b
            update() {
                this.age += 0.0012; // Gradual growth scale

                // Level up cost of 5 HP for each full number
                const currentAgeFloor = Math.floor(this.age);
                if (currentAgeFloor > this.prevAgeFloor) {
                    this.hp = Math.max(0, this.hp - 5);
                    this.prevAgeFloor = currentAgeFloor;
                }

                // Standard lifespan or HP depletion death triggers
                const isDeadOrGhost = (this.age >= this.maxLifespan || this.hp <= 0 || this.radius >= 10 || this.age >= 10.0);
                if (isDeadOrGhost) {
                    this.vx = 0;
                    this.vy = 0;
                    this.opacity -= 0.004;
                    if (this.opacity <= 0) {
                        this.isDead = true;
                    }
                    return; // Return immediately! Freeze ghosts and dead bodies completely and skip all logic.
                }

                // 1. HEALTH AND DEATH DECAY (8-10px HP drain loop)
                if (this.radius >= 8) {
                    this.hp -= 0.08; // Senior degradation curve drain
                }

                // Food collision check
                if (this.hp < 100) {
                    for (let f = foods.length - 1; f >= 0; f--) {
                        const food = foods[f];
                        const distToFood = Math.sqrt((food.x - this.x)**2 + (food.y - this.y)**2);
                        if (distToFood < this.radius + food.size / 2 + 5) {
                            this.hp = Math.min(100, this.hp + food.hpValue);
                            foods.splice(f, 1);
                            spawnFood(1); // Spawn a new food starting at 1px size
                        }
                    }
                }

                // Locate nearest food within visual range (150px)
                let nearestFood = null;
                let minDistToFood = Infinity;
                if (this.hp < 50) {
                    for (let f = 0; f < foods.length; f++) {
                        const food = foods[f];
                        const dist = Math.sqrt((food.x - this.x)**2 + (food.y - this.y)**2);
                        if (dist < 150) { // 150px visual range
                            if (dist < minDistToFood) {
                                minDistToFood = dist;
                                nearestFood = food;
                            }
                        }
                    }
                }

                // 2A. MALE BREEDING COMPETITION DUELS (Territorial Rivalry)
                if (this.gender === 'm' && this.radius >= 4 && this.age < this.maxLifespan && this.hp > 0) {
                    for (let f = 0; f < creatures.length; f++) {
                        const fem = creatures[f];
                        if (fem.gender === 'f' && fem.radius >= 4 && fem.radius <= 7 && fem.age < fem.maxLifespan) {
                            const distToFem = Math.sqrt((fem.x - this.x)**2 + (fem.y - this.y)**2);
                            if (distToFem < 100) {
                                for (let m = 0; m < creatures.length; m++) {
                                    const rival = creatures[m];
                                    if (rival !== this && rival.gender === 'm' && rival.radius >= 4 && rival.age < rival.maxLifespan && rival.hp > 0) {
                                        const distToRival = Math.sqrt((rival.x - this.x)**2 + (rival.y - this.y)**2);
                                        const rivalDistToFem = Math.sqrt((fem.x - rival.x)**2 + (fem.y - rival.y)**2);

                                        if (distToRival < 80 && rivalDistToFem < 100) {
                                            // 5-10% chance per second (~7.5% average) -> 0.00125 per frame
                                            if (Math.random() < 0.00125) {
                                                const rivalDamage = (this.radius >= rival.radius) ? 10 : 5;
                                                rival.hp -= rivalDamage;

                                                if (rival.radius > this.radius) {
                                                    this.hp -= (1 + Math.random());
                                                }

                                                // Bounce them away from each other violently
                                                const bAngle = Math.atan2(rival.y - this.y, rival.x - this.x);
                                                this.vx = -Math.cos(bAngle) * (this.baseSpeed * 2);
                                                this.vy = -Math.sin(bAngle) * (this.baseSpeed * 2);
                                                rival.vx = Math.cos(bAngle) * (rival.baseSpeed * 2);
                                                rival.vy = Math.sin(bAngle) * (rival.baseSpeed * 2);
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

                // 2B. FEMALE BREEDING COMPETITION DUELS (Territorial Rivalry)
                if (this.gender === 'f' && this.radius >= 4 && this.age < this.maxLifespan && this.hp > 0) {
                    for (let m = 0; m < creatures.length; m++) {
                        const male = creatures[m];
                        if (male.gender === 'm' && male.radius >= 4 && male.radius <= 8 && male.age < male.maxLifespan) {
                            const distToMale = Math.sqrt((male.x - this.x)**2 + (male.y - this.y)**2);
                            if (distToMale < 100) {
                                for (let f = 0; f < creatures.length; f++) {
                                    const rival = creatures[f];
                                    if (rival !== this && rival.gender === 'f' && rival.radius >= 4 && rival.age < rival.maxLifespan && rival.hp > 0) {
                                        const distToRival = Math.sqrt((rival.x - this.x)**2 + (rival.y - this.y)**2);
                                        const rivalDistToMale = Math.sqrt((male.x - rival.x)**2 + (male.y - rival.y)**2);

                                        if (distToRival < 80 && rivalDistToMale < 100) {
                                            // 5-10% chance per second (~7.5% average) -> 0.00125 per frame
                                            if (Math.random() < 0.00125) {
                                                const rivalDamage = (this.radius >= rival.radius) ? 10 : 5;
                                                rival.hp -= rivalDamage;

                                                if (rival.radius > this.radius) {
                                                    this.hp -= (1 + Math.random());
                                                }

                                                // Bounce them away from each other violently
                                                const bAngle = Math.atan2(rival.y - this.y, rival.x - this.x);
                                                this.vx = -Math.cos(bAngle) * (this.baseSpeed * 2);
                                                this.vy = -Math.sin(bAngle) * (this.baseSpeed * 2);
                                                rival.vx = Math.cos(bAngle) * (rival.baseSpeed * 2);
                                                rival.vy = Math.sin(bAngle) * (rival.baseSpeed * 2);
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }

                // 3. CHECK IF TOUCHING ANYONE ELSE AND RESOLVE OVERLAPS (WITH SCENT CLEARING SPRAY)
                let isTouchingAnyone = false;
                if (this.age < this.maxLifespan && this.hp > 0) {
                    for (let k = 0; k < creatures.length; k++) {
                        const other = creatures[k];
                        if (other !== this && other.age < other.maxLifespan && other.hp > 0) {
                            const tDx = other.x - this.x; const tDy = other.y - this.y;
                            const dist = Math.sqrt(tDx * tDx + tDy * tDy);
                            const minDistance = this.radius + other.radius;

                            if (dist < minDistance) {
                                isTouchingAnyone = true;
                                const overlap = minDistance - dist;
                                if (dist > 0) {
                                    const pushX = (tDx / dist) * overlap * 0.5;
                                    const pushY = (tDy / dist) * overlap * 0.5;
                                    this.x -= pushX;
                                    this.y -= pushY;
                                    other.x += pushX;
                                    other.y += pushY;

                                    // Deflect velocities to bounce off each other
                                    const angle = Math.atan2(tDy, tDx);
                                    this.vx = -Math.cos(angle) * this.baseSpeed;
                                    this.vy = -Math.sin(angle) * this.baseSpeed;
                                    other.vx = Math.cos(angle) * other.baseSpeed;
                                    other.vy = Math.sin(angle) * other.baseSpeed;
                                } else {
                                    const randAngle = Math.random() * Math.PI * 2;
                                    this.x -= Math.cos(randAngle) * minDistance * 0.5;
                                    this.y -= Math.sin(randAngle) * minDistance * 0.5;
                                    other.x += Math.cos(randAngle) * minDistance * 0.5;
                                    other.y += Math.sin(randAngle) * minDistance * 0.5;
                                }

                                for (let s = scentTrails.length - 1; s >= 0; s--) {
                                    const trail = scentTrails[s];
                                    if (Math.sqrt((trail.x - this.x)**2 + (trail.y - this.y)**2) < 100) {
                                        scentTrails.splice(s, 1);
                                    }
                                }
                            } else if (dist < minDistance + 4) {
                                isTouchingAnyone = true;
                                for (let s = scentTrails.length - 1; s >= 0; s--) {
                                    const trail = scentTrails[s];
                                    if (Math.sqrt((trail.x - this.x)**2 + (trail.y - this.y)**2) < 100) {
                                        scentTrails.splice(s, 1);
                                    }
                                }
                            }
                        }
                    }
                }

                const isFemaleFleeing = this.gender === 'f' && this.breedCooldownAge && this.age < this.breedCooldownAge;
                const isMaleFrozen = this.gender === 'm' && this.breedCooldownAge && this.age < this.breedCooldownAge;

                if (this.radius >= 4 && this.radius < 8 && !isFemaleFleeing && !isMaleFrozen && !isTouchingAnyone && this.age < this.maxLifespan && this.hp > 0 && Math.random() < 0.1) {
                    scentTrails.push({ x: this.x, y: this.y, gender: this.gender, intensity: 1.0 });
                }

                let isOverridden = isMaleFrozen || isFemaleFleeing || (this.age >= 10.0) || (this.hp <= 0);

                // 4. FEMALE FLIGHT CONTROL
                if (isFemaleFleeing && this.age < this.maxLifespan && this.hp > 0) {
                    for (let k = 0; k < creatures.length; k++) {
                        const other = creatures[k];
                        if (other.gender === 'm' && other.age < other.maxLifespan && other.hp > 0) {
                            const fDx = other.x - this.x; const fDy = other.y - this.y;
                            if (Math.sqrt(fDx * fDx + fDy * fDy) < 150) {
                                const escapeAngle = Math.atan2(-fDy, -fDx);
                                this.vx = Math.cos(escapeAngle) * (this.baseSpeed * 1.5);
                                this.vy = Math.sin(escapeAngle) * (this.baseSpeed * 1.5);
                                break;
                            }
                        }
                    }
                }

                // 5. STANDARD NAVIGATION WITH SENILITY DECAY OR FOOD SEEKING
                if (!isOverridden && this.age < this.maxLifespan && this.hp > 0) {
                    if (this.hp < 50 && nearestFood) {
                        const fAngle = Math.atan2(nearestFood.y - this.y, nearestFood.x - this.x);
                        this.vx = Math.cos(fAngle) * this.baseSpeed;
                        this.vy = Math.sin(fAngle) * this.baseSpeed;
                    } else if (this.hp < 15) {
                        // Exclusive food seeking but no food spotted, just random wander
                        if (Math.random() < 0.05) {
                            this.vx += (Math.random() - 0.5) * 0.6; this.vy += (Math.random() - 0.5) * 0.6;
                            const currSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                            if (currSpeed > this.baseSpeed) { this.vx = (this.vx / currSpeed) * this.baseSpeed; this.vy = (this.vy / currSpeed) * this.baseSpeed; }
                        }
                    } else {
                        // Normal movement (including fallback for 15 <= HP < 50 when no food is spotted)
                        let bestMate = null;
                        let maxMateHp = -1;
                        const isAbleToMate = (this.gender === 'f' && this.radius >= 4 && this.radius <= 7 && (!this.breedCooldownAge || this.age >= this.breedCooldownAge)) ||
                                             (this.gender === 'm' && this.radius >= 4 && this.radius <= 8 && (!this.breedCooldownAge || this.age >= this.breedCooldownAge));

                        if (isAbleToMate && this.age < this.maxLifespan && this.hp > 0) {
                            for (let k = 0; k < creatures.length; k++) {
                                const other = creatures[k];
                                if (other !== this && other.gender !== this.gender && other.age < other.maxLifespan && other.hp > 0) {
                                    const otherEligible = (other.gender === 'f' && other.radius >= 4 && other.radius <= 7) ||
                                                          (other.gender === 'm' && other.radius >= 4 && other.radius <= 8);
                                    if (otherEligible) {
                                        const distToMate = Math.sqrt((other.x - this.x)**2 + (other.y - this.y)**2);
                                        if (distToMate < 150) {
                                            if (other.hp > maxMateHp) {
                                                maxMateHp = other.hp;
                                                bestMate = other;
                                            }
                                        }
                                    }
                                }
                            }
                        }

                        if (bestMate) {
                            const mAngle = Math.atan2(bestMate.y - this.y, bestMate.x - this.x);
                            this.vx = Math.cos(mAngle) * (this.baseSpeed * 1.25);
                            this.vy = Math.sin(mAngle) * (this.baseSpeed * 1.25);
                        } else {
                            // Scent trail tracking fallback
                            let trackingTarget = null; let maxDesire = -1;
                            if (this.radius >= 4) {
                                const currentDigit = Math.floor(this.radius);
                                const interestMap = { 4: 0.90, 5: 0.60, 6: 0.40, 7: 0.30, 8: 0.20, 9: 0.10 };
                                const activeInterest = interestMap[currentDigit] !== undefined ? interestMap[currentDigit] : 0.10;

                                let maxScentRange = 120;
                                if (creatures.length >= 100) { maxScentRange = 0; }
                                else if (creatures.length > 50) { maxScentRange = 120 * (1 - ((creatures.length - 50) / 50)); }

                                let isSenileMoment = (currentDigit >= 7 && Math.random() > activeInterest);
                                if (Math.random() < activeInterest && !isSenileMoment && maxScentRange > 0) {
                                    for (let i = 0; i < scentTrails.length; i++) {
                                        const trail = scentTrails[i];
                                        if (trail.gender !== this.gender) {
                                            const dist = Math.sqrt((trail.x - this.x)**2 + (trail.y - this.y)**2);
                                            if (dist < maxScentRange && dist > 15) {
                                                const followChance = 0.75 * trail.intensity * (1 - (dist / maxScentRange));
                                                if (followChance > maxDesire) { maxDesire = followChance; trackingTarget = trail; }
                                            }
                                        }
                                    }
                                }
                                if (isSenileMoment && Math.random() < 0.15) {
                                    this.vx = (Math.random() - 0.5) * (this.baseSpeed * 2); this.vy = (Math.random() - 0.5) * (this.baseSpeed * 2);
                                }
                            }

                            if (trackingTarget && Math.random() < maxDesire) {
                                const tAngle = Math.atan2(trackingTarget.y - this.y, trackingTarget.x - this.x);
                                this.vx = Math.cos(tAngle) * (this.baseSpeed * 1.25); this.vy = Math.sin(tAngle) * (this.baseSpeed * 1.25);
                            } else if (Math.random() < 0.05) {
                                this.vx += (Math.random() - 0.5) * 0.6; this.vy += (Math.random() - 0.5) * 0.6;
                                const currSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                                if (currSpeed > this.baseSpeed) { this.vx = (this.vx / currSpeed) * this.baseSpeed; this.vy = (this.vy / currSpeed) * this.baseSpeed; }
                            }
                        }
                    }
                }

                this.x += this.vx; this.y += this.vy;

                if (this.x - this.radius < 0) { this.x = this.radius; this.vx = Math.abs(this.vx); }
                if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx = -Math.abs(this.vx); }
                if (this.y - this.radius < 0) { this.y = this.radius; this.vy = Math.abs(this.vy); }
                if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy = -Math.abs(this.vy); }
            }
}
//b3
         function initEcosystem() {
            initFood();
            for (let i = 0; i < INITIAL_POPULATION; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                creatures.push(new Creature(x, y, i % 2 === 0 ? 'f' : 'm', false));
            }
        }

        function processEcosystemMechanics() {
            for (let i = 0; i < foods.length; i++) {
                foods[i].update();
                foods[i].draw();
            }

            for (let i = scentTrails.length - 1; i >= 0; i--) {
                const trail = scentTrails[i];
                trail.intensity -= 0.0025;
                if (trail.intensity <= 0) { scentTrails.splice(i, 1); continue; }
                ctx.save(); ctx.globalAlpha = trail.intensity * 0.25;
                ctx.fillStyle = trail.gender === 'f' ? 'rgba(255, 82, 162, 0.4)' : 'rgba(0, 210, 255, 0.4)';
                ctx.beginPath(); ctx.arc(trail.x, trail.y, 2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            }

            const babiesToBirth = [];

            if (creatures.length < 75) {
                for (let i = 0; i < creatures.length; i++) {
                    for (let j = i + 1; j < creatures.length; j++) {
                        const c1 = creatures[i]; const c2 = creatures[j];
                        if (c1.gender !== c2.gender && (!c1.breedCooldownAge || c1.age >= c1.breedCooldownAge) && (!c2.breedCooldownAge || c2.age >= c2.breedCooldownAge)) {
                            const female = c1.gender === 'f' ? c1 : c2;
                            const male = c1.gender === 'm' ? c1 : c2;

                            if (female.radius >= 4 && female.radius <= 7 && male.radius >= 4 && male.radius <= 8) {
                                const dx = male.x - female.x; const dy = male.y - female.y;
                                if (Math.sqrt(dx * dx + dy * dy) < female.radius + male.radius) {

                                    // SAFETY VALVE: Determine litter size based on current population scarcity
                                    // Normal pop = 1 kid. Endangered pop (under 10) = 2 to 4 kids at once!
                                    let litterSize = 1;
                                    if (creatures.length < 10) {
                                        litterSize = Math.floor(Math.random() * 3) + 2;
                                    }

                                    for (let b = 0; b < litterSize; b++) {
                                        const sAngle = Math.random() * Math.PI * 2;
                                        const bx = female.x + Math.cos(sAngle) * (female.radius + 6);
                                        const by = female.y + Math.sin(sAngle) * (female.radius + 6);

                                        const baby = new Creature(bx, by, Math.random() < 0.5 ? 'f' : 'm', true);
                                        // Scatter their velocities so they don't ride the same line
                                        baby.vx = Math.cos(sAngle) * (1.5 + Math.random());
                                        baby.vy = Math.sin(sAngle) * (1.5 + Math.random());

                                        babiesToBirth.push(baby);
                                    }

                                    female.breedCooldownAge = female.age + 0.5;
                                    male.breedCooldownAge = male.age + 0.2;
                                }
                            }
                        }
                    }
                }
            }

            babiesToBirth.forEach(baby => creatures.push(baby));

            let fCount = 0, mCount = 0;
            for (let i = creatures.length - 1; i >= 0; i--) {
                const c = creatures[i]; c.update();
                if (c.isDead) { creatures.splice(i, 1); }
                else { c.draw(); if (c.gender === 'f') fCount++; else mCount++; }
            }

            document.getElementById('popTotal').textContent = creatures.length;
            document.getElementById('popFemales').textContent = fCount;
            document.getElementById('popMales').textContent = mCount;
        }

        function mainLoop() {
            ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            processEcosystemMechanics();
            requestAnimationFrame(mainLoop);
        }

        initEcosystem();
        mainLoop();
    </script>
</body>
</html>
